# ==============================================================================
# Chrony Stratum 1 Priority & Fallback Tuning
# ==============================================================================
# NOTE: The '99-' prefix ensures this file loads alphabetically AFTER Ubuntu's
#       /etc/chrony/conf.d/ubuntu-nts.conf so its directives take precedence.
#       Companion sources live in /etc/chrony/sources.d/dfw-stratum-1.sources.
# ==============================================================================

# Override Ubuntu's default 'authselectmode require/prefer' in ubuntu-nts.conf.
# Without this, chronyd rejects unauthenticated NIST Stratum 1 clocks (state 'T')
# whenever NTS-authenticated backups (Cloudflare, Netnod, Canonical) are online.
authselectmode ignore

# Add 30ms (0.03s) of virtual root distance per stratum to enforce tier priority
# during fallback if all 'prefer'-flagged Tier 1 NIST clocks become unreachable:
#   - Tier 1:  NIST (Stratum 1, prefer)   -> ~12-24ms + 30ms = ~42-54ms (always wins via 'prefer')
#   - Tier 2a: Netnod (Stratum 1, NTS)    -> ~68ms    + 30ms = ~98ms    (wins fallback #1)
#   - Tier 2b: Cloudflare (Stratum 3, NTS)-> ~13ms    + 90ms = ~103ms   (wins fallback #2)
#   - Tier 3:  Canonical (Stratum 2, NTS) -> ~47-55ms + 60ms = ~107-115ms (last resort)
stratumweight 0.03

# Reject any source whose root distance (half round-trip delay + dispersion)
# exceeds 100ms (0.1s). Keeps NIST (~12-24ms) and Netnod (~68-76ms) eligible
# while filtering out degraded or high-jitter upstream paths.
maxdistance 0.1

# Require at least 2 agreeing truechimer sources before updating the system clock
# to prevent a single misbehaving clock from skewing local time.
minsources 2
