# 🅲 🅷 🅰 🅽 🅳 🅴 🆁
# --------------------------------------------
# Avahi configuration file
# File location: /etc/avahi/avahi-daemon.conf
#
# After setting up, restart Avahi with
# sudo systemctl restart avahi-daemon

[server]
host-name=Mjolnir
host-name-from-machine-id=no
use-ipv4=yes
use-ipv6=no
allow-interfaces=eno1
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
publish-hinfo=yes
publish-workstation=yes
publish-addresses=yes
publish-domain=yes
publish-resolv-conf-dns-servers=no
